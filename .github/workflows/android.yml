name: Android Debug APK
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 SDK is installed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] ||
             [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk'
      - name: Read APK version
        id: version
        run: |
          version=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk |
            sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "name=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: android-release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bedrock-bridge-debug
      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          asset="checker00007-Bedrock-Bridge-$tag-debug.apk"
          if gh release view "$tag" --json assets --jq '.assets[].name' > release-assets.txt; then
            if grep -Fxq "$asset" release-assets.txt; then
              exit 0
            fi
            cp app-debug.apk "$asset"
            gh release upload "$tag" "$asset"
          else
            cp app-debug.apk "$asset"
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "Bedrock Bridge $tag · Android-Testversion" \
              --notes "Signierte Debug-APK für Android 8 oder neuer. NetherNet ist experimentell. Die Anleitung für den ersten Xbox-Test steht im README."
          fi
